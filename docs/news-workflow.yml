# Optional: move this file to .github/workflows/news.yml to refresh the Explore page every 2 hours.
# It runs pipeline/07_fetch_news.py and commits site/public/data/news.json, which redeploys the site on Vercel.
name: Refresh AI news

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/07_fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "dev-tube-bot"
          git config user.email "dev-tube-bot@users.noreply.github.com"
          git add site/public/data/news.json
          git diff --cached --quiet || (git commit -m "Refresh AI news" && git push)
